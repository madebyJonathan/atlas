<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas Construction — Hero</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <section class="hero">
      <!-- Dark overlay -->
      <div class="hero__overlay"></div>

      <div class="hero__inner">
        <!-- Left: headline + subtext -->
        <div class="hero__text">
          <h1 class="hero__heading">
            Build your dream space with confidence
          </h1>
          <p class="hero__subtext">
            Quality craftsmanship meets honest communication. We bring your
            renovation vision to life with clear pricing, expert guidance, and
            on-time delivery. Serving West Los Angeles since 2014.
          </p>
        </div>

        <!-- Right: buttons -->
        <div class="hero__actions">
          <a href="#contact" class="btn btn--outline">
            Get Free Consultation
          </a>
          <a href="#selected-works" class="btn btn--ghost">
            View Portfolio
            <svg class="btn__arrow" viewBox="0 0 24 24" aria-hidden="true">
              <line x1="5" y1="12" x2="19" y2="12" />
              <polyline points="12 5 19 12 12 19" />
            </svg>
          </a>
        </div>
      </div>
    </section>

  </body>
</html>
